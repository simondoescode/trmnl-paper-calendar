name: Package TRMNL plugin
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and package
        run: |
          python scripts/package_plugin.py
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("dist/paper-calendar.zip") as z:
              assert "settings.yml" in z.namelist()
              assert "full.liquid" in z.namelist()
              assert all("/" not in name for name in z.namelist())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-calendar
          path: dist/paper-calendar.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/paper-calendar.zip --generate-notes --title "Paper Calendar ${GITHUB_REF_NAME}"
